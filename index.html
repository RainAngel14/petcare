<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pet Care - Login</title>

    <link rel="stylesheet" href="./Styles/index.css">
</head>
<body>
    <div class="container">
        <section class="left-panel">
            <div class="logo">PetCare</div>
            <img src="./Assets/Images/dog-login-left-panel.jpg" alt="Imagen de un perro">
        </section>

        <section class="right-panel">
            <div class="login">
                <h1 class="title">Inicia sesión</h1>
                <span class="subtitle">Ingresa con tu correo y contraseña.</span>

                <form class="login-form">
                    <label for="email">Correo electrónico</label>
                    <input type="email" id="email" placeholder="nombre@correo.com" required>
                    <label for="password">Contraseña</label>
                    <input type="password" id="password" placeholder="Contraseña" required>

                    <button class="form-submit" formaction="./Pages/initial-panel.html" type="submit">Iniciar sesión</button>
                </form>

                <div class="register-link">
                    <span>¿No tienes una cuenta? <a href="./Pages/register.html">Regístrate</a></span>
                </div>
            </div>
        </section>
    </div>
</body>
</html>
