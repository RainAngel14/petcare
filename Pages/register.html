<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pet Care - Registro</title>
    <link rel="stylesheet" href="../Styles/register.css">
</head>
<body>
    <div class="container">
        <section class="left-panel">
            <div class="logo">
                PetCare
            </div>

            <div class="content">
                <h1>Únete como propietario <br/>o como proveedor</h1>
                <ul>
                    <li>Propietarios: encuentra y reserva servicios.</li>
                    <li>Proveedores: gestiona tu agenda y gana visibilidad.</li>
                </ul>
            </div>
        </section>

        <section class="right-panel">
            <div class="register">
                <h1 class="title">Crea tu cuenta</h1>

                <form>
                    <span class="user-type">Tipo de usuario</span>
                    <div class="selection-container">
                        <div class="selection-active">
                            <input type="radio" id="propietary" name="account_type" value="1" checked>
                            <label for="propietary" class="selection-label">Propietario</label><br>
                        </div>

                        <div class="selection">
                            <input type="radio" id="provider" name="account_type" value="2">
                            <label for="provider" class="selection-label">Proveedor</label><br>
                        </div>
                    </div>

                    <div class="input-container">
                        <label for="name">Nombre completo</label>
                        <input type="text" id="name" placeholder="Nombre completo" required>

                        <label for="email">Correo electrónico</label>
                        <input type="email" id="email" placeholder="nombre@correo.com" required>

                        <label for="phone">Teléfono de contacto</label>
                        <input type="tel" id="phone" placeholder="555-555-5555" required>

                        <label for="password">Contraseña</label>
                        <input type="password" id="password" placeholder="Mínimo 8 caracteres" required>
                    </div>

                    <button class="form-submit" formaction="../index.html" type="submit">Crear cuenta</button>
                </form>

                <div class="register-link">
                    <span>¿Ya tienes una cuenta? <a href="../index.html">Inicia sesión</a></span>
                </div>
            </div>
        </section>
    </div>
</body>
</html>
